name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag must use semantic versioning, for example v0.2.0" >&2
            exit 1
          }

      # Signatures and provenance describe the ref that started this run, so
      # it must be the release tag that is checked out and built.
      - name: Require the run ref to be the release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/tags/${VERSION}" ]]; then
            echo "Run this workflow from the ${VERSION} tag (Use workflow from: Tag), not from ${GITHUB_REF}, so signatures and provenance match the built commit." >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            local os="$1"
            local arch="$2"
            local extension="$3"
            local archive_format="$4"
            local base="agentclip_${VERSION}_${os}_${arch}"
            local directory="dist/${base}"

            mkdir -p "$directory"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X github.com/wendellrocha/agentclip/internal/buildinfo.Version=${VERSION}" \
              -o "${directory}/agentclip${extension}" \
              ./cmd/agentclip
            cp README.md "$directory/"

            if [[ "$archive_format" == "zip" ]]; then
              (cd dist && zip -qr "${base}.zip" "$base")
            else
              tar -C dist -czf "dist/${base}.tar.gz" "$base"
            fi
          }

          build linux amd64 "" tar.gz
          build linux arm64 "" tar.gz
          build darwin amd64 "" tar.gz
          build darwin arm64 "" tar.gz
          build windows amd64 .exe zip
          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signature: the certificate binds the bundle to this workflow.
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"

          arguments=("repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f "tag_name=${VERSION}")
          if [[ -n "$previous_tag" ]]; then
            arguments+=(-f "previous_tag_name=${previous_tag}")
          fi
          gh api --method POST "${arguments[@]}" --jq .body > release-notes.md

          if grep -Eq '/pull/[0-9]+' release-notes.md; then
            exit 0
          fi

          {
            echo "## Commits"
            if [[ -n "$previous_tag" ]]; then
              git log --format='- %s ([%h](https://github.com/'"${GITHUB_REPOSITORY}"'/commit/%H))' "${previous_tag}..${VERSION}"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${VERSION}"
            else
              git log --format='- %s ([%h](https://github.com/'"${GITHUB_REPOSITORY}"'/commit/%H))' "${VERSION}"
            fi
          } > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.bundle
            scripts/install.sh
            scripts/install.ps1
