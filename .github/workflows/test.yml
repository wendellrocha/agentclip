name: Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with race detector
        shell: bash
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "total coverage: ${total}%"
          awk -v total="$total" -v floor=47 'BEGIN { exit (total + 0 < floor) }'

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  native-clipboard:
    name: Native clipboard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # macOS and Windows runners may not expose a usable clipboard session, so
    # they report without blocking until they have proven stable.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, experimental: false }
          - { os: macos-latest, experimental: true }
          - { os: windows-latest, experimental: true }
    env:
      AGENTCLIP_NATIVE_CLIPBOARD_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install X server and xclip
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip

      # A virtual X server stands in for a desktop session on Linux.
      - name: Test against the real clipboard (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -count=1 -v -run '^TestNative' ./internal/clipboard

      - name: Test against the real clipboard
        if: runner.os != 'Linux'
        shell: bash
        run: go test -count=1 -v -run '^TestNative' ./internal/clipboard

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Mirrors the release build so a broken target fails before tagging.
      - name: Build release target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/agentclip

  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Module integrity
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

  installers:
    name: Installers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS ships BSD awk and only shasum, so the installer must run there too.
      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/install.sh
          sh scripts/install.sh --help

      - name: Test installer authenticity checks
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh

      - name: Shellcheck installer
        if: runner.os == 'Linux'
        run: shellcheck -S warning scripts/install.sh scripts/test-install.sh

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content -Raw scripts/install.ps1)) | Out-Null"

      - name: Test installer authenticity checks (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

      # Windows PowerShell 5.1 is what most users run the installer with.
      - name: Test installer authenticity checks (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
